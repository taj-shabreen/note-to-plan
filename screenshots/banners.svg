<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="NoteToPlan: messy notes in, structured plan out, every backend step recorded" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16181d"/><stop offset="1" stop-color="#0d0f13"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#2a2f3a"/>
    </pattern>
    <clipPath id="frame"><rect x="8" y="8" width="1184" height="324" rx="18"/></clipPath>
  </defs>
  <style>
    .mono{font-family:'JetBrains Mono','DM Mono','Cascadia Code',Consolas,'Courier New',monospace}
    .serif{font-family:'Fraunces',Georgia,'Times New Roman',serif}
    .node rect{fill:#10181a;stroke:#3a4150;stroke-width:2}
    .node text{fill:#9aa3b2}
    .node{animation:none}
    .n rect{animation:lit 8s infinite}
    .n text{animation:litt 8s infinite}
    .n1 rect,.n1 text{animation-delay:0s}
    .n2 rect,.n2 text{animation-delay:.5s}
    .n3 rect,.n3 text{animation-delay:1s}
    .n4 rect,.n4 text{animation-delay:1.5s}
    .n5 rect,.n5 text{animation-delay:2s}
    .n6 rect,.n6 text{animation-delay:2.5s}
    .n7 rect,.n7 text{animation-delay:3s}
    @keyframes lit{0%{fill:#10181a;stroke:#3a4150}6%{fill:#e6f4ef;stroke:#2f9e7a}80%{fill:#e6f4ef;stroke:#2f9e7a}92%{fill:#10181a;stroke:#3a4150}100%{fill:#10181a;stroke:#3a4150}}
    @keyframes litt{0%{fill:#9aa3b2}6%{fill:#14231e}80%{fill:#14231e}92%{fill:#9aa3b2}100%{fill:#9aa3b2}}
    .flow{stroke:#2f9e7a;stroke-width:2;stroke-dasharray:6 6;animation:dash 1.2s linear infinite}
    @keyframes dash{to{stroke-dashoffset:-12}}
    .blink{animation:blink 1s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
    @media (prefers-reduced-motion: reduce){
      .n rect,.n text,.flow,.blink{animation:none}
      .n rect{fill:#e6f4ef;stroke:#2f9e7a}.n text{fill:#14231e}
    }
  </style>
  <rect x="8" y="8" width="1184" height="324" rx="18" fill="url(#bg)" stroke="#3a4150" stroke-width="2"/>
  <g clip-path="url(#frame)"><rect width="1200" height="340" fill="url(#dots)"/></g>

  <text class="serif" x="60" y="112" font-size="76" font-weight="700" fill="#f3efe6">Note<tspan fill="#e5533c">To</tspan>Plan<tspan class="blink" fill="#4f6bed">_</tspan></text>
  <text class="mono" x="64" y="146" font-size="15" letter-spacing="5" fill="#8b93a3">EXECUTION LEDGER</text>
  <text class="mono" x="64" y="182" font-size="17" fill="#b7bfcc">Messy notes in. Structured plan out. Every backend step on record.</text>

  <g class="mono" font-size="13" letter-spacing="1">
    <g class="n n1"><g class="node"><rect x="60"  y="222" width="132" height="58" rx="6"/><text x="80"  y="256" font-size="15" font-weight="600">receive</text></g></g>
    <g class="n n2"><g class="node"><rect x="226" y="222" width="132" height="58" rx="6"/><text x="246" y="256" font-size="15" font-weight="600">validate</text></g></g>
    <g class="n n3"><g class="node"><rect x="392" y="222" width="132" height="58" rx="6"/><text x="412" y="256" font-size="15" font-weight="600">extract</text></g></g>
    <g class="n n4"><g class="node"><rect x="558" y="222" width="132" height="58" rx="6"/><text x="578" y="256" font-size="15" font-weight="600">structure</text></g></g>
    <g class="n n5"><g class="node"><rect x="724" y="222" width="132" height="58" rx="6"/><text x="744" y="256" font-size="15" font-weight="600">organize</text></g></g>
    <g class="n n6"><g class="node"><rect x="890" y="222" width="132" height="58" rx="6"/><text x="910" y="256" font-size="15" font-weight="600">save</text></g></g>
    <g class="n n7"><g class="node"><rect x="1056" y="222" width="100" height="58" rx="6"/><text x="1076" y="256" font-size="15" font-weight="600">finish</text></g></g>
  </g>
  <g>
    <line class="flow" x1="192" y1="251" x2="226" y2="251"/>
    <line class="flow" x1="358" y1="251" x2="392" y2="251"/>
    <line class="flow" x1="524" y1="251" x2="558" y2="251"/>
    <line class="flow" x1="690" y1="251" x2="724" y2="251"/>
    <line class="flow" x1="856" y1="251" x2="890" y2="251"/>
    <line class="flow" x1="1022" y1="251" x2="1056" y2="251"/>
  </g>
  <text class="mono" x="60" y="312" font-size="12" letter-spacing="2" fill="#6b7383">RECEIVE → VALIDATE → EXTRACT → STRUCTURE → ORGANIZE → SAVE → FINISH</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
